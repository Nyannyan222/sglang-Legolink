[pytest]
testpaths = tests
pythonpath = .
markers =
    unit: small deterministic correctness test
    cpu: test that is safe on a CPU-only host
    cuda: test that requires a CUDA device
    triton: test that requires the Triton CUDA backend
    flashinfer: test that requires FlashInfer
    integration: cross-module or backend integration test
    slow: test excluded from the fast default suite

